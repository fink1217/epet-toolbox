<!doctype html>
<meta charset="utf-8">
<title>繪本插圖總覽</title>
<link rel="stylesheet" href="/web/css/base.css">
<style>body{padding:20px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.g div{background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px}.g b{font:12px monospace}</style>
<div class="g" id="g"></div>
<script type="module">
  // 用法：/tools/why-art-preview.html?only=moduleInside,moduleVsBare
  //       /tools/why-art-preview.html?mod=gen-art（其他插圖模組：deploy-art、devices…；只列不用參數的函式）
  const q = new URLSearchParams(location.search);
  const A = await import(`/web/js/svg/${q.get('mod') || 'why-art'}.js`);
  const only = q.get('only');
  const names = only ? only.split(',') : Object.keys(A).filter((k) => typeof A[k] === 'function' && A[k].length === 0);
  const g = document.getElementById('g');
  for (const n of names) {
    const d = document.createElement('div');
    d.innerHTML = '<b>' + n + '</b>' + A[n]();
    g.append(d);
  }
</script>
