<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寫入裝置｜電子雞工具箱</title>
  <meta name="description" content="一鍵把韌體燒進電子雞、一鍵把素材打包進 SD 卡。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/deploy.css">
</head>
<body>
  <main class="wrap">
    <section class="page-head">
      <h1>寫入裝置</h1>
      <p>兩件事，各按一次：把程式燒進電子雞、把素材放進 SD 卡。兩件事互不相干，先做哪個都可以。</p>
    </section>

    <div class="deploy-grid">
      <section class="card task" aria-labelledby="flash-title">
        <div class="task-head">
          <div>
            <span class="tag">A</span>
            <h2 id="flash-title">刷韌體</h2>
            <p>插上 USB，把電子雞的大腦燒進去。</p>
          </div>
          <div class="task-art" id="flash-art"></div>
        </div>
        <div class="task-body" id="flash-body" aria-live="polite"></div>
        <div class="task-why" id="flash-why"></div>
      </section>

      <section class="card task" aria-labelledby="pack-title">
        <div class="task-head">
          <div>
            <span class="tag">B</span>
            <h2 id="pack-title">打包素材到 SD 卡</h2>
            <p>把素材資料夾轉成電子雞看得懂的格式。</p>
          </div>
          <div class="task-art" id="pack-art"></div>
        </div>
        <div class="task-body" id="pack-body" aria-live="polite"></div>
        <div class="task-why" id="pack-why"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/deploy/page.js"></script>
</body>
</html>
